[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "global-product-search"
version = "0.1.0"
description = "A minimal product search CLI and library with yt-dlp-like extractors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
]

[project.scripts]
gps = "global_product_search.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3.0",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/global_product_search"]
